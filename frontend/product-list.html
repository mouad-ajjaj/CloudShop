<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tous les produits - ShopCloud</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        indigo: { 
                            50: '#f3eefc', 
                            100: '#d8cbf7', 
                            500: '#8e44ad', 
                            600: '#6f42c1', // Brand Purple
                            700: '#5a32a3' 
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 text-gray-900">

    <header class="bg-white border-b border-gray-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 py-4">
            <div class="flex items-center justify-between gap-8">
                <a href="index.html" class="flex items-center gap-2 text-decoration-none">
                    <div class="w-10 h-10 bg-gradient-to-br from-indigo-600 to-purple-600 rounded-lg flex items-center justify-center text-white shadow-lg">
                        <i class="fas fa-shopping-cart text-lg"></i>
                    </div>
                    <span class="text-xl font-bold text-indigo-600 tracking-tight">ShopCloud</span>
                </a>
                <div class="flex-1 max-w-2xl hidden md:block">
                    <div class="relative">
                        <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
                        <input type="text" placeholder="Rechercher des produits..." class="w-full pl-12 pr-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all shadow-sm bg-gray-50 focus:bg-white">
                    </div>
                </div>
                <div class="flex items-center gap-4">
                    <a href="cart.html" class="relative p-3 text-gray-600 hover:bg-indigo-50 hover:text-indigo-600 rounded-lg transition-colors">
                        <i class="fas fa-shopping-cart text-xl"></i>
                        <span class="absolute top-1 right-1 w-5 h-5 bg-red-500 text-white text-xs font-bold rounded-full flex items-center justify-center border-2 border-white">3</span>
                    </a>
                    <a href="login.html" class="flex items-center gap-2 px-5 py-2.5 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition-all shadow-md shadow-indigo-200 font-medium">
                        <i class="far fa-user"></i>
                        <span>Connexion</span>
                    </a>
                </div>
            </div>
        </div>
    </header>

    <div class="max-w-7xl mx-auto px-6 py-8">
        <div class="flex flex-col lg:flex-row gap-8">
            
            <aside class="w-full lg:w-64 flex-shrink-0">
                <div class="bg-white rounded-xl border border-gray-200 p-6 sticky top-24 shadow-sm">
                    <div class="flex items-center gap-2 mb-6 border-b border-gray-100 pb-4">
                        <i class="fas fa-sliders-h text-indigo-600"></i>
                        <h3 class="text-lg font-bold text-gray-900">Filtres</h3>
                    </div>

                    <div class="mb-6">
                        <label class="block text-sm font-medium text-gray-700 mb-2">Recherche</label>
                        <input type="text" placeholder="Mot-clé..." class="w-full px-3 py-2 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all text-sm">
                    </div>

                    <div class="mb-6">
                        <h4 class="text-sm font-bold text-gray-900 mb-3">Catégories</h4>
                        <div class="space-y-2.5" id="categories-filter">
                            </div>
                    </div>

                    <div class="mb-6">
                        <h4 class="text-sm font-bold text-gray-900 mb-3">Prix (€)</h4>
                        <div class="flex items-center gap-2">
                            <input type="number" placeholder="Min" class="w-full px-3 py-2 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 text-sm">
                            <span class="text-gray-400">-</span>
                            <input type="number" placeholder="Max" class="w-full px-3 py-2 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 text-sm">
                        </div>
                    </div>

                    <button class="w-full px-4 py-3 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition-all shadow-md shadow-indigo-200 font-medium text-sm">
                        Appliquer les filtres
                    </button>
                </div>
            </aside>

            <main class="flex-1">
                <div class="flex flex-col sm:flex-row items-center justify-between mb-6 gap-4">
                    <div>
                        <h1 class="text-2xl font-bold text-gray-900 mb-1">Tous les produits</h1>
                        <p class="text-gray-500 text-sm"><span id="result-count">12</span> résultats trouvés</p>
                    </div>
                    <select class="px-4 py-2 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500/20 text-sm bg-white shadow-sm cursor-pointer hover:border-indigo-300 transition-colors">
                        <option>Pertinence</option>
                        <option>Prix croissant</option>
                        <option>Prix décroissant</option>
                        <option>Nouveautés</option>
                    </select>
                </div>

                <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                    </div>

                <div class="flex items-center justify-center gap-2 mt-12">
                    <button class="px-4 py-2 border border-gray-200 rounded-lg hover:bg-gray-50 text-gray-600 transition-colors disabled:opacity-50">Précédent</button>
                    <button class="px-4 py-2 bg-indigo-600 text-white rounded-lg shadow-md shadow-indigo-200 font-medium">1</button>
                    <button class="px-4 py-2 border border-gray-200 rounded-lg hover:bg-gray-50 text-gray-600 transition-colors">2</button>
                    <button class="px-4 py-2 border border-gray-200 rounded-lg hover:bg-gray-50 text-gray-600 transition-colors">3</button>
                    <button class="px-4 py-2 border border-gray-200 rounded-lg hover:bg-gray-50 text-gray-600 transition-colors">Suivant</button>
                </div>
            </main>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8000/api';
        
        const categories = [
            'Électronique', 'Mode', 'Maison', 'Sport', 'Beauté', 'Livres', 'Jouets', 'Auto'
        ];

        // 1. Render Filter Categories
        document.getElementById('categories-filter').innerHTML = categories.map(cat => `
            <label class="flex items-center gap-3 cursor-pointer group">
                <div class="relative flex items-center">
                    <input type="checkbox" value="${cat}" onchange="fetchProducts()" class="peer h-4 w-4 border-gray-300 rounded text-indigo-600 focus:ring-indigo-500 transition-all cursor-pointer category-filter">
                </div>
                <span class="text-sm text-gray-600 group-hover:text-indigo-600 transition-colors">${cat}</span>
            </label>
        `).join('');

        // 2. Mock Data Fallback
        const MOCK_PRODUCTS = Array.from({ length: 12 }, (_, i) => ({
            id: i + 1,
            name: `Produit Premium ${i + 1}`,
            price: (Math.random() * 100 + 20).toFixed(2),
            rating: (Math.random() * 2 + 3).toFixed(1),
            image: i % 3 === 0 
                ? 'https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=400'
                : i % 3 === 1 
                ? 'https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400'
                : 'https://images.unsplash.com/photo-1572635196237-14b3f281503f?w=400',
            category: categories[i % categories.length]
        }));

        // 3. Fetch Logic
        async function fetchProducts() {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = '<div class="col-span-full text-center py-12"><div class="animate-spin rounded-full h-12 w-12 border-b-2 border-indigo-600 mx-auto"></div></div>';

            // Build Query
            const urlParams = new URLSearchParams(window.location.search);
            const searchQuery = urlParams.get('q') || '';
            
            // Get selected categories
            const selectedCats = Array.from(document.querySelectorAll('.category-filter:checked')).map(cb => cb.value);
            
            let apiUrl = `${API_URL}/products?search=${searchQuery}`;
            if(selectedCats.length > 0) apiUrl += `&categories=${selectedCats.join(',')}`;

            try {
                const res = await fetch(apiUrl);
                if (!res.ok) throw new Error('API Error');
                const data = await res.json();
                renderProducts(data.length ? data : []);
            } catch (e) {
                console.warn("Using Mock Data", e);
                // Simple client-side filter for mock data
                const filtered = MOCK_PRODUCTS.filter(p => 
                    (searchQuery ? p.name.toLowerCase().includes(searchQuery.toLowerCase()) : true) &&
                    (selectedCats.length ? selectedCats.includes(p.category) : true)
                );
                renderProducts(filtered);
            }
        }

        function renderProducts(products) {
            const grid = document.getElementById('product-grid');
            document.getElementById('result-count').innerText = products.length;

            if(products.length === 0) {
                grid.innerHTML = '<div class="col-span-full text-center text-gray-500">Aucun produit trouvé.</div>';
                return;
            }

            grid.innerHTML = products.map(p => `
            <div class="bg-white rounded-2xl border border-gray-200 overflow-hidden hover:shadow-xl hover:-translate-y-1 transition-all duration-300 group cursor-pointer">
                <div class="aspect-[4/3] bg-gray-100 relative overflow-hidden">
                    <img src="${p.image}" onclick="window.location.href='product-detail.html?id=${p.id}'" alt="${p.name}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                    <span class="absolute top-3 left-3 bg-white/90 backdrop-blur-sm px-2 py-1 rounded-md text-xs font-semibold text-gray-700 shadow-sm">${p.category}</span>
                    <button class="absolute top-3 right-3 p-2 bg-white/90 rounded-full shadow-md text-gray-400 hover:text-red-500 transition-colors backdrop-blur-sm opacity-0 group-hover:opacity-100 translate-y-2 group-hover:translate-y-0 duration-300">
                        <i class="far fa-heart"></i>
                    </button>
                </div>
                
                <div class="p-5">
                    <div class="flex justify-between items-start mb-2">
                        <h3 onclick="window.location.href='product-detail.html?id=${p.id}'" class="text-gray-900 font-bold text-lg leading-tight group-hover:text-indigo-600 transition-colors line-clamp-1">${p.name}</h3>
                    </div>
                    
                    <div class="flex items-center gap-1 mb-4">
                        ${Array(5).fill(0).map((_, i) => 
                            `<i class="fas fa-star text-xs ${i < Math.floor(p.rating) ? 'text-yellow-400' : 'text-gray-300'}"></i>`
                        ).join('')}
                        <span class="text-xs text-gray-500 ml-1 font-medium">(${p.rating})</span>
                    </div>

                    <div class="flex items-center justify-between pt-3 border-t border-gray-50">
                        <span class="text-xl font-bold text-indigo-600">${p.price} €</span>
                        <button onclick="addToCart(${p.id}, '${p.name.replace(/'/g, "\\'")}', ${p.price})" class="px-4 py-2 bg-indigo-50 text-indigo-600 rounded-lg hover:bg-indigo-600 hover:text-white transition-all font-medium text-sm flex items-center gap-2 shadow-sm hover:shadow-md">
                            <i class="fas fa-shopping-bag text-xs"></i> Ajouter
                        </button>
                    </div>
                </div>
            </div>
        `).join('');
        }

        function addToCart(id, name, price) {
            let cart = JSON.parse(localStorage.getItem('cart') || '[]');
            const existing = cart.find(item => item.id == id);
            if (existing) { existing.quantity++; } 
            else { cart.push({ id, name, price, quantity: 1 }); }
            localStorage.setItem('cart', JSON.stringify(cart));
            alert(`${name} ajouté au panier !`);
        }

        // Init
        fetchProducts();
    </script>
</body>
</html>
