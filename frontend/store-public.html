<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boutique - ShopCloud</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="assets/js/config.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        // These CSS variables will be updated by JS based on store settings
                        brand: { 
                            600: 'var(--color-primary-600, #9333ea)', 
                        }
                    }
                }
            }
        }
    </script>
    
    <style>
        /* Default Purple if no store color is found */
        :root {
            --color-primary-600: #9333ea; 
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 font-sans min-h-screen flex flex-col">

    <header class="bg-white border-b border-gray-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center gap-3">
                    <a href="index.html" class="text-gray-400 hover:text-gray-600 transition-colors" title="Retour au marché">
                        <i class="fas fa-arrow-left"></i>
                    </a>
                    <div class="w-10 h-10 bg-[var(--color-primary-600)] rounded-lg flex items-center justify-center text-white shadow-md transition-colors duration-300">
                        <i class="fas fa-store"></i>
                    </div>
                    <span id="nav-store-name" class="text-xl font-bold tracking-tight">Chargement...</span>
                </div>

                <div class="flex items-center gap-4">
                    <a href="cart.html" class="relative p-2 text-gray-600 hover:text-[var(--color-primary-600)] transition-colors">
                        <i class="fas fa-shopping-cart text-xl"></i>
                    </a>
                </div>
            </div>
        </div>
    </header>

    <div class="relative bg-gray-900 text-white overflow-hidden min-h-[300px] flex items-center justify-center">
        <div class="absolute inset-0">
            <img id="store-banner" src="https://images.unsplash.com/photo-1441986300917-64674bd600d8?w=1600" class="w-full h-full object-cover opacity-40">
        </div>
        
        <div class="relative max-w-7xl mx-auto px-4 py-12 text-center z-10">
            <h1 id="hero-title" class="text-4xl md:text-5xl font-extrabold tracking-tight mb-4 drop-shadow-lg">
                </h1>
            <p id="hero-desc" class="text-lg md:text-xl text-gray-200 max-w-2xl mx-auto drop-shadow-md">
                </p>
        </div>
    </div>

    <main class="flex-grow">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
            
            <div class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4">
                <h2 class="text-2xl font-bold text-gray-900">Tous les produits</h2>
                
                <div class="flex gap-3 w-full md:w-auto">
                    <div class="relative flex-1 md:w-64">
                        <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                        <input type="text" id="search-input" placeholder="Rechercher dans la boutique..." class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[var(--color-primary-600)] focus:border-transparent">
                    </div>
                </div>
            </div>

            <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
                <div class="animate-pulse">
                    <div class="bg-gray-200 rounded-xl aspect-square mb-4"></div>
                    <div class="h-4 bg-gray-200 rounded w-3/4 mb-2"></div>
                </div>
                <div class="animate-pulse">
                    <div class="bg-gray-200 rounded-xl aspect-square mb-4"></div>
                    <div class="h-4 bg-gray-200 rounded w-3/4 mb-2"></div>
                </div>
            </div>

            <div id="empty-state" class="hidden text-center py-12">
                <div class="w-16 h-16 bg-gray-100 rounded-full flex items-center justify-center mx-auto mb-4">
                    <i class="fas fa-box-open text-gray-400 text-2xl"></i>
                </div>
                <h3 class="text-lg font-medium text-gray-900">Aucun produit trouvé</h3>
                <p class="text-gray-500">Cette boutique n'a pas encore ajouté de produits.</p>
            </div>

        </div>
    </main>

    <footer class="bg-white border-t border-gray-200 py-12">
        <div class="max-w-7xl mx-auto px-4 text-center">
            <p class="text-gray-500 text-sm">© 2026 ShopCloud.</p>
        </div>
    </footer>

    <script>
        // CONFIG
        const API = typeof API_BASE_URL !== 'undefined' ? API_BASE_URL : 'http://localhost:8000/api';
        const token = localStorage.getItem('token');

        // --- 1. SMART INITIALIZATION ---
        async function initPage() {
            const urlParams = new URLSearchParams(window.location.search);
            let storeId = urlParams.get('id');

            // --- THE FIX: AUTO-REDIRECT FOR VENDORS ---
            // If no ID is in URL, but user is logged in, assume they want THEIR store.
            if (!storeId && token) {
                try {
                    const res = await fetch(`${API}/vendor/store/me`, {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    if (res.ok) {
                        const myStore = await res.json();
                        storeId = myStore.id;
                        
                        // Update the URL in the browser without reloading (UX Improvement)
                        window.history.replaceState(null, '', `?id=${storeId}`);
                    }
                } catch(e) {
                    console.log("Not a vendor or error fetching store info.");
                }
            }
            // -------------------------------------------

            if (!storeId) {
                // If we still have no ID (Client accessed page directly), go back to marketplace
                alert("Veuillez sélectionner une boutique sur la page d'accueil.");
                window.location.href = 'index.html';
                return;
            }

            // Proceed to load the store
            loadStoreDetails(storeId);
        }

        // --- 2. FETCH STORE DATA ---
        async function loadStoreDetails(id) {
            try {
                // Fetch Store + Products
                const res = await fetch(`${API}/stores/${id}`);
                if (!res.ok) throw new Error("Store not found");
                
                const store = await res.json();

                // A. Update UI (Banner, Title, Colors)
                document.title = `${store.name} - ShopCloud`;
                document.getElementById('nav-store-name').innerText = store.name;
                document.getElementById('hero-title').innerText = store.name;
                document.getElementById('hero-desc').innerText = store.description || '';

                // Banner
                if (store.banner) {
                    const bannerUrl = store.banner.startsWith('http') 
                        ? store.banner 
                        : `http://localhost:8000/storage/${store.banner}`;
                    document.getElementById('store-banner').src = bannerUrl;
                }

                // Custom Color (CSS Variable)
                if (store.primary_color) {
                    document.documentElement.style.setProperty('--color-primary-600', store.primary_color);
                }

                // Layout (Grid Columns)
                const grid = document.getElementById('products-grid');
                grid.className = 'grid gap-6 '; // Reset base classes
                if (store.layout === 'grid-2') grid.classList.add('grid-cols-1', 'sm:grid-cols-2');
                else if (store.layout === 'grid-3') grid.classList.add('grid-cols-1', 'sm:grid-cols-2', 'md:grid-cols-3');
                else grid.classList.add('grid-cols-1', 'sm:grid-cols-2', 'md:grid-cols-3', 'lg:grid-cols-4'); // Default

                // B. Render Products
                renderProducts(store.products || []);

            } catch (error) {
                console.error(error);
                alert("Impossible de charger la boutique.");
                window.location.href = 'index.html';
            }
        }

        // --- 3. RENDER PRODUCTS ---
        function renderProducts(products) {
            const grid = document.getElementById('products-grid');
            const empty = document.getElementById('empty-state');

            if (products.length === 0) {
                grid.innerHTML = '';
                empty.classList.remove('hidden');
                return;
            }

            empty.classList.add('hidden');
            grid.innerHTML = products.map(product => {
                const imageUrl = product.image 
                    ? (product.image.startsWith('http') ? product.image : `http://localhost:8000/storage/${product.image}`)
                    : 'https://via.placeholder.com/300';
                
                return `
                <div class="bg-white rounded-xl border border-gray-100 shadow-sm hover:shadow-md transition-all duration-300 group overflow-hidden flex flex-col h-full">
                    <div class="aspect-square bg-gray-100 relative overflow-hidden">
                        <img src="${imageUrl}" alt="${product.name}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                        
                        <div class="absolute bottom-4 right-4 translate-y-12 group-hover:translate-y-0 transition-transform duration-300">
                            <button onclick="addToCart(${product.id}, '${product.name.replace(/'/g, "\\'")}', ${product.price}, '${imageUrl}')" class="w-10 h-10 bg-white rounded-full shadow-lg flex items-center justify-center text-gray-900 hover:text-[var(--color-primary-600)] hover:bg-gray-50 transition-colors">
                                <i class="fas fa-plus"></i>
                            </button>
                        </div>
                    </div>
                    
                    <div class="p-4 flex flex-col flex-grow">
                        <div class="flex justify-between items-start mb-2">
                            <h3 class="font-bold text-gray-900 line-clamp-1">${product.name}</h3>
                            <span class="text-[var(--color-primary-600)] font-bold text-sm bg-purple-50 px-2 py-1 rounded-md">
                                ${parseFloat(product.price).toFixed(2)} €
                            </span>
                        </div>
                        <p class="text-gray-500 text-sm line-clamp-2 mb-4 flex-grow">${product.description || ''}</p>
                        
                        <a href="product-detail.html?id=${product.id}" class="w-full py-2.5 border border-gray-200 text-gray-700 font-medium rounded-lg hover:bg-gray-50 hover:border-gray-300 transition-colors text-center block">
                            Voir détails
                        </a>
                    </div>
                </div>
                `;
            }).join('');
        }

        // --- 4. CART & SEARCH ---
        function addToCart(id, name, price, image) {
            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            const existing = cart.find(item => item.id === id);
            
            if(existing) {
                existing.quantity++;
            } else {
                cart.push({ id, name, price, image, quantity: 1 });
            }
            localStorage.setItem('cart', JSON.stringify(cart));
            
            // Visual feedback on button
            const btn = event.currentTarget;
            btn.innerHTML = '<i class="fas fa-check text-green-500"></i>';
            setTimeout(() => btn.innerHTML = '<i class="fas fa-plus"></i>', 1500);
        }

        document.getElementById('search-input').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const cards = document.querySelectorAll('#products-grid > div');
            
            let found = false;
            cards.forEach(card => {
                const title = card.querySelector('h3').innerText.toLowerCase();
                if (title.includes(term)) {
                    card.style.display = 'flex';
                    found = true;
                } else {
                    card.style.display = 'none';
                }
            });

            const empty = document.getElementById('empty-state');
            if (!found && term !== '') {
                empty.classList.remove('hidden');
                empty.querySelector('p').innerText = "Aucun résultat pour cette recherche.";
            } else {
                if(cards.length > 0) empty.classList.add('hidden');
            }
        });

        // START
        initPage();
    </script>
</body>
</html>
