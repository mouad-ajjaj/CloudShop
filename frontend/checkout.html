<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finaliser la commande - ShopCloud</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="assets/js/config.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        indigo: { 50: '#f3eefc', 100: '#d8cbf7', 500: '#8e44ad', 600: '#6f42c1', 700: '#5a32a3' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 text-gray-900">

    <header class="bg-white border-b border-gray-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 py-4">
            <div class="flex items-center justify-between gap-8">
                <a href="index.html" class="flex items-center gap-2 text-decoration-none">
                    <div class="w-10 h-10 bg-gradient-to-br from-indigo-600 to-purple-600 rounded-lg flex items-center justify-center text-white shadow-lg">
                        <i class="fas fa-shopping-cart text-lg"></i>
                    </div>
                    <span class="text-xl font-bold text-indigo-600 tracking-tight">ShopCloud</span>
                </a>
            </div>
        </div>
    </header>

    <div class="max-w-7xl mx-auto px-6 py-12" id="main-content">
        <h1 class="text-3xl font-bold text-gray-900 mb-8">Finaliser la commande</h1>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <div class="lg:col-span-2 space-y-8">
                
                <div class="bg-white rounded-xl border border-gray-200 p-8 shadow-sm">
                    <h2 class="text-xl font-bold text-gray-900 mb-6 flex items-center gap-3">
                        <span class="w-8 h-8 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center text-sm font-bold">1</span>
                        Adresse de livraison
                    </h2>
                    
                    <form class="grid grid-cols-1 md:grid-cols-2 gap-6" id="address-form">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Prénom</label>
                            <input type="text" id="firstname" placeholder="Jean" class="w-full px-4 py-3 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-gray-50 focus:bg-white" required>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Nom</label>
                            <input type="text" id="lastname" placeholder="Dupont" class="w-full px-4 py-3 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-gray-50 focus:bg-white" required>
                        </div>
                        <div class="md:col-span-2">
                            <label class="block text-sm font-medium text-gray-700 mb-2">Adresse</label>
                            <input type="text" id="address" placeholder="123 Rue de la Paix" class="w-full px-4 py-3 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-gray-50 focus:bg-white" required>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Ville</label>
                            <input type="text" id="city" placeholder="Paris" class="w-full px-4 py-3 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-gray-50 focus:bg-white" required>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Code Postal</label>
                            <input type="text" id="zip" placeholder="75001" class="w-full px-4 py-3 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-gray-50 focus:bg-white" required>
                        </div>
                        <div class="md:col-span-2">
                            <label class="block text-sm font-medium text-gray-700 mb-2">Pays</label>
                            <select id="country" class="w-full px-4 py-3 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-gray-50 focus:bg-white">
                                <option value="France">France</option>
                                <option value="Belgique">Belgique</option>
                                <option value="Suisse">Suisse</option>
                                <option value="Maroc">Maroc</option>
                                <option value="Canada">Canada</option>
                            </select>
                        </div>
                    </form>
                </div>

                <div class="bg-white rounded-xl border border-gray-200 p-8 shadow-sm">
                    <h2 class="text-xl font-bold text-gray-900 mb-6 flex items-center gap-3">
                        <span class="w-8 h-8 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center text-sm font-bold">2</span>
                        Mode de paiement
                    </h2>
                    <div class="p-4 border-2 border-indigo-600 bg-indigo-50 rounded-xl flex items-center gap-4">
                        <i class="fas fa-check-circle text-indigo-600 text-xl"></i>
                        <span class="font-medium text-indigo-900">Paiement à la livraison (Simulation)</span>
                    </div>
                </div>
            </div>

            <div class="w-full">
                <div class="bg-white rounded-xl border border-gray-200 p-6 sticky top-24 shadow-sm">
                    <h2 class="text-xl font-bold text-gray-900 mb-6">Récapitulatif</h2>

                    <div class="space-y-4 mb-6 pb-6 border-b border-gray-100" id="checkout-items">
                        </div>

                    <div class="space-y-3 mb-6 pb-6 border-b border-gray-100">
                        <div class="flex justify-between text-gray-600">
                            <span>Sous-total</span>
                            <span class="font-medium" id="subtotal">0.00 €</span>
                        </div>
                        <div class="flex justify-between text-gray-600">
                            <span>Livraison</span>
                            <span class="font-medium" id="shipping">0.00 €</span>
                        </div>
                    </div>

                    <div class="flex justify-between items-end mb-8">
                        <span class="font-bold text-gray-900 text-lg">Total à payer</span>
                        <span class="text-3xl font-bold text-indigo-600" id="total">0.00 €</span>
                    </div>

                    <button onclick="submitOrder()" class="w-full px-6 py-4 bg-indigo-600 text-white rounded-xl font-bold hover:bg-indigo-700 transition-all shadow-lg hover:shadow-xl transform hover:-translate-y-1 flex items-center justify-center gap-2">
                        <i class="fas fa-lock"></i> Confirmer la commande
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8000/api';
        const cartItems = JSON.parse(localStorage.getItem('cart') || '[]');

        // 1. SAFE EMPTY CHECK (No Redirect, just message)
        if(cartItems.length === 0) {
            document.getElementById('main-content').innerHTML = `
                <div class="text-center py-20">
                    <div class="w-20 h-20 bg-gray-100 rounded-full flex items-center justify-center mx-auto mb-6">
                        <i class="fas fa-shopping-basket text-3xl text-gray-400"></i>
                    </div>
                    <h1 class="text-3xl font-bold text-gray-900 mb-4">Votre panier est vide</h1>
                    <p class="text-gray-500 mb-8">Ajoutez des produits avant de passer commande.</p>
                    <a href="index.html" class="inline-block px-8 py-3 bg-indigo-600 text-white rounded-xl font-bold hover:bg-indigo-700 transition-all">
                        Retourner à la boutique
                    </a>
                </div>
            `;
            throw new Error("Cart is empty");
        }

        // 2. ROBUST CALCULATION (Handles Strings like "89 €" and Numbers)
        const shipping = 5.99;
        
        const subtotal = cartItems.reduce((sum, item) => {
            let price = item.price;
            // Clean string if necessary
            if (typeof price === 'string') {
                price = parseFloat(price.replace('€', '').replace(',', '.').trim());
            }
            // Fallback for bad data
            if (isNaN(price)) price = 0;
            
            return sum + (price * item.quantity);
        }, 0);

        const total = subtotal + shipping;

        // 3. RENDER UI
        document.getElementById('checkout-items').innerHTML = cartItems.map(item => `
            <div class="flex items-center justify-between text-sm group">
                <div class="flex items-center gap-3">
                    <span class="bg-gray-100 text-gray-600 w-6 h-6 flex items-center justify-center rounded text-xs font-bold">${item.quantity}x</span>
                    <span class="text-gray-900 font-medium group-hover:text-indigo-600 transition-colors">${item.name}</span>
                </div>
                <span class="text-gray-900 font-bold">${(item.price * item.quantity).toFixed(2)} €</span>
            </div>
        `).join('');

        document.getElementById('subtotal').innerText = subtotal.toFixed(2) + ' €';
        document.getElementById('shipping').innerText = shipping.toFixed(2) + ' €';
        document.getElementById('total').innerText = total.toFixed(2) + ' €';

        // 4. SUBMIT FUNCTION
        async function submitOrder() {
            const token = localStorage.getItem('token');
            if(!token) {
                alert("Veuillez vous connecter pour passer commande.");
                window.location.href = 'login.html';
                return;
            }

            const addressData = {
                firstname: document.getElementById('firstname').value,
                lastname: document.getElementById('lastname').value,
                address: document.getElementById('address').value,
                city: document.getElementById('city').value,
                zip: document.getElementById('zip').value,
                country: document.getElementById('country').value
            };

            if(!addressData.address || !addressData.lastname || !addressData.city) {
                alert("Veuillez remplir l'adresse.");
                return;
            }

            try {
                const res = await fetch(`${API_URL}/orders`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json',  // <--- THE CRITICAL FIX
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ 
                        cart: cartItems, 
                        address: addressData, 
                        total: total 
                    })
                });

                if(!res.ok) {
                    const err = await res.json();
                    throw new Error(err.message || "Erreur lors de la commande.");
                }
                
                localStorage.removeItem('cart');
                alert("Commande validée avec succès !");
                window.location.href = 'index.html';

            } catch (e) {
                console.error(e);
                alert("Erreur: " + e.message);
            }
        }
    </script>
</body>
</html>
