<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mes Produits - ShopCloud</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="assets/js/config.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        purple: { 50: '#faf5ff', 100: '#f3e8ff', 600: '#9333ea', 700: '#7e22ce' },
                        indigo: { 600: '#4f46e5' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">

    <div class="flex min-h-screen">
        
        <aside class="w-64 bg-white border-r border-gray-200 flex-shrink-0 fixed h-full z-10">
            <div class="p-6">
                <div class="flex items-center gap-3 mb-8">
                    <div class="w-10 h-10 bg-gradient-to-br from-purple-600 to-indigo-600 rounded-lg flex items-center justify-center text-white shadow-md">
                        <i class="fas fa-shopping-bag text-lg"></i>
                    </div>
                    <div>
                        <div class="text-gray-900 font-bold">Ma Boutique</div>
                        <div class="text-xs text-gray-500 font-medium uppercase tracking-wide">Propriétaire</div>
                    </div>
                </div>

                <nav class="space-y-2">
                    <a href="dashboard.html" class="flex items-center gap-3 px-4 py-3 text-gray-700 hover:bg-gray-50 rounded-lg transition-colors font-medium">
                        <i class="fas fa-chart-pie w-5 text-center"></i>
                        <span>Tableau de bord</span>
                    </a>
                    <a href="store-products.html" class="flex items-center gap-3 px-4 py-3 bg-purple-50 text-purple-700 rounded-lg transition-colors font-medium">
                        <i class="fas fa-box w-5 text-center"></i>
                        <span>Produits</span>
                    </a>
                    <a href="dashboard.html" class="flex items-center gap-3 px-4 py-3 text-gray-700 hover:bg-gray-50 rounded-lg transition-colors font-medium">
                        <i class="fas fa-shopping-cart w-5 text-center"></i>
                        <span>Commandes</span>
                    </a>
                    <a href="store-customization.html" class="flex items-center gap-3 px-4 py-3 text-gray-700 hover:bg-gray-50 rounded-lg transition-colors font-medium">
                        <i class="fas fa-paint-brush w-5 text-center"></i>
                        <span>Personnalisation</span>
                    </a>
                    
                    <a href="store-public.html" target="_blank" class="flex items-center gap-3 px-4 py-3 text-gray-700 hover:bg-gray-50 rounded-lg transition-colors font-medium">
                        <i class="fas fa-external-link-alt w-5 text-center"></i>
                        <span>Voir ma boutique</span>
                    </a>

                    <a href="index.html" class="flex items-center gap-3 px-4 py-3 text-gray-700 hover:bg-gray-50 rounded-lg transition-colors font-medium">
                        <i class="fas fa-home w-5 text-center"></i>
                        <span>Retour à l'accueil</span>
                    </a>

                    <a href="#" class="flex items-center gap-3 px-4 py-3 text-gray-400 cursor-not-allowed rounded-lg transition-colors font-medium">
                        <i class="fas fa-cog w-5 text-center"></i>
                        <span>Paramètres</span>
                    </a>
                </nav>
            </div>
            
            <div class="absolute bottom-0 w-full p-6 border-t border-gray-100 bg-white">
                <a href="#" onclick="logout(event)" class="flex items-center gap-3 text-red-600 hover:bg-red-50 px-4 py-3 rounded-lg transition-colors font-medium">
                    <i class="fas fa-sign-out-alt w-5 text-center"></i>
                    <span>Déconnexion</span>
                </a>
            </div>
        </aside>

        <main class="flex-1 ml-64 p-8">
            <div class="max-w-7xl mx-auto">
                
                <div class="flex items-center justify-between mb-8">
                    <div>
                        <h1 class="text-3xl font-bold text-gray-900 mb-2">Gestion des produits</h1>
                        <p class="text-gray-600">Gérez votre catalogue de produits</p>
                    </div>
                    <a href="store-product-form.html" class="flex items-center gap-2 px-6 py-3 bg-purple-600 text-white rounded-lg hover:bg-purple-700 transition-all shadow-md shadow-purple-200 font-medium">
                        <i class="fas fa-plus"></i>
                        <span>Ajouter un produit</span>
                    </a>
                </div>

                <div class="bg-white rounded-xl border border-gray-200 p-4 mb-6 shadow-sm">
                    <div class="flex flex-col md:flex-row items-center gap-4">
                        <div class="flex-1 relative w-full">
                            <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
                            <input type="text" id="search-input" placeholder="Rechercher un produit..." class="w-full pl-12 pr-4 py-3 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500/20 focus:border-purple-500 transition-all">
                        </div>
                        <select class="w-full md:w-auto px-4 py-3 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500/20 focus:border-purple-500 bg-white cursor-pointer hover:border-purple-300 transition-colors">
                            <option value="">Toutes catégories</option>
                            <option value="Électronique">Électronique</option>
                            <option value="Mode">Mode</option>
                            <option value="Maison">Maison</option>
                        </select>
                    </div>
                </div>

                <div class="bg-white rounded-xl border border-gray-200 overflow-hidden shadow-sm">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left">
                            <thead class="bg-gray-50 border-b border-gray-200">
                                <tr>
                                    <th class="px-6 py-4 text-xs font-semibold text-gray-500 uppercase tracking-wider">Produit</th>
                                    <th class="px-6 py-4 text-xs font-semibold text-gray-500 uppercase tracking-wider">Catégorie</th>
                                    <th class="px-6 py-4 text-xs font-semibold text-gray-500 uppercase tracking-wider">Prix</th>
                                    <th class="px-6 py-4 text-xs font-semibold text-gray-500 uppercase tracking-wider">Stock</th>
                                    <th class="px-6 py-4 text-xs font-semibold text-gray-500 uppercase tracking-wider">Statut</th>
                                    <th class="px-6 py-4 text-xs font-semibold text-gray-500 uppercase tracking-wider">Actions</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-gray-200" id="products-table-body">
                                <tr>
                                    <td colspan="6" class="px-6 py-8 text-center text-gray-500">
                                        <div class="flex flex-col items-center">
                                            <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-purple-600 mb-2"></div>
                                            Chargement...
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script>
        const API_URL = 'http://localhost:8000/api';
        const token = localStorage.getItem('token');

        // 1. Auth Check
        if (!token) window.location.href = 'login.html';

        function logout(e) {
            e.preventDefault();
            localStorage.clear();
            window.location.href = 'index.html';
        }

        // 2. Fetch Products
        async function loadProducts() {
            try {
                const response = await fetch(`${API_URL}/vendor/products`, {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Accept': 'application/json'
                    }
                });

                if(response.ok) {
                    const products = await response.json();
                    renderTable(products);
                } else {
                    console.error("Failed to load products");
                }
            } catch (error) {
                console.error('Error loading products:', error);
            }
        }

        // 3. Render Table
        function renderTable(products) {
            const tbody = document.getElementById('products-table-body');
            
            if (products.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="text-center py-8 text-gray-500">Aucun produit trouvé. Commencez par en ajouter un !</td></tr>`;
                return;
            }

            tbody.innerHTML = products.map(p => `
                <tr class="hover:bg-gray-50 transition-colors group">
                    <td class="px-6 py-4">
                        <div class="flex items-center gap-4">
                            <div class="w-12 h-12 bg-gray-100 rounded-lg overflow-hidden flex-shrink-0 border border-gray-200">
                                <img src="${p.image || 'https://via.placeholder.com/150'}" alt="${p.name}" class="w-full h-full object-cover">
                            </div>
                            <span class="font-medium text-gray-900 group-hover:text-purple-700 transition-colors">${p.name}</span>
                        </div>
                    </td>
                    <td class="px-6 py-4 text-gray-600">
                        <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-gray-100 text-gray-800">
                            ${p.category}
                        </span>
                    </td>
                    <td class="px-6 py-4 font-medium text-gray-900">${parseFloat(p.price).toFixed(2)} €</td>
                    <td class="px-6 py-4 text-gray-600">${p.stock}</td>
                    <td class="px-6 py-4">
                        <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-bold ${p.stock > 0 ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}">
                            ${p.stock > 0 ? 'En stock' : 'Rupture'}
                        </span>
                    </td>
                    <td class="px-6 py-4">
                        <div class="flex items-center gap-2">
                            <button onclick="window.location.href='store-product-form.html?id=${p.id}'" class="p-2 text-gray-400 hover:text-purple-700 hover:bg-purple-50 rounded-lg transition-colors">
                                <i class="far fa-edit"></i>
                            </button>
                            <button onclick="deleteProduct(${p.id})" class="p-2 text-red-400 hover:text-red-600 hover:bg-red-50 rounded-lg transition-colors">
                                <i class="fas fa-trash-alt"></i>
                            </button>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        // 4. Delete Action
        async function deleteProduct(id) {
            if(!confirm("Êtes-vous sûr de vouloir supprimer ce produit ?")) return;
            
            try {
                const res = await fetch(`${API_URL}/vendor/products/${id}`, {
                    method: 'DELETE',
                    headers: { 
                        'Authorization': `Bearer ${token}`,
                        'Accept': 'application/json'
                    }
                });

                if(res.ok) {
                    loadProducts(); // Reload table
                } else {
                    alert("Erreur lors de la suppression");
                }
            } catch(e) { 
                alert("Erreur réseau"); 
            }
        }

        // Search Filter
        document.getElementById('search-input').addEventListener('input', function(e) {
            const term = e.target.value.toLowerCase();
            const rows = document.querySelectorAll('#products-table-body tr');
            
            rows.forEach(row => {
                const text = row.innerText.toLowerCase();
                row.style.display = text.includes(term) ? '' : 'none';
            });
        });

        // Initialize
        loadProducts();
    </script>
</body>
</html>
