<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Gestion Boutiques - Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="assets/js/config.js"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">

    <div class="flex min-h-screen">
        <aside class="w-64 bg-white border-r border-gray-200 flex-shrink-0 fixed h-full z-10">
            <div class="p-6">
                <div class="flex items-center gap-3 mb-8">
                    <div class="w-10 h-10 bg-gradient-to-br from-blue-600 to-indigo-600 rounded-lg flex items-center justify-center text-white shadow-md">
                        <i class="fas fa-shield-alt text-lg"></i>
                    </div>
                    <div><div class="text-gray-900 font-bold">Admin Panel</div></div>
                </div>
                <nav class="space-y-2">
                    <a href="admin-dashboard.html" class="flex items-center gap-3 px-4 py-3 text-gray-700 hover:bg-gray-50 rounded-lg transition-colors font-medium"><i class="fas fa-th-large w-5"></i> <span>Tableau de bord</span></a>
                    <a href="admin-users.html" class="flex items-center gap-3 px-4 py-3 text-gray-700 hover:bg-gray-50 rounded-lg transition-colors font-medium"><i class="fas fa-users w-5"></i> <span>Utilisateurs</span></a>
                    <a href="admin-stores.html" class="flex items-center gap-3 px-4 py-3 bg-blue-50 text-blue-700 rounded-lg transition-colors font-medium"><i class="fas fa-store w-5"></i> <span>Boutiques</span></a>
                    <a href="admin-products.html" class="flex items-center gap-3 px-4 py-3 text-gray-700 hover:bg-gray-50 rounded-lg transition-colors font-medium"><i class="fas fa-box w-5"></i> <span>Produits</span></a>
                </nav>
            </div>
            <div class="absolute bottom-0 w-full p-6 border-t border-gray-100 bg-white">
                <a href="#" onclick="logout(event)" class="flex items-center gap-3 text-red-600 hover:bg-red-50 px-4 py-3 rounded-lg font-medium"><i class="fas fa-sign-out-alt w-5"></i> <span>Déconnexion</span></a>
            </div>
        </aside>

        <main class="flex-1 ml-64 p-8">
            <div class="max-w-7xl mx-auto">
                <h1 class="text-3xl font-bold text-gray-900 mb-2">Gestion des boutiques</h1>
                <p class="text-gray-600 mb-8">Liste complète des boutiques.</p>

                <div class="bg-white rounded-xl border border-gray-200 overflow-hidden shadow-sm">
                    <table class="w-full text-left">
                        <thead class="bg-gray-50 border-b border-gray-200">
                            <tr>
                                <th class="px-6 py-4 text-xs font-semibold text-gray-500 uppercase">Boutique</th>
                                <th class="px-6 py-4 text-xs font-semibold text-gray-500 uppercase">Propriétaire</th>
                                <th class="px-6 py-4 text-xs font-semibold text-gray-500 uppercase">Produits</th>
                                <th class="px-6 py-4 text-xs font-semibold text-gray-500 uppercase">Création</th>
                                <th class="px-6 py-4 text-xs font-semibold text-gray-500 uppercase">Actions</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-gray-200" id="stores-table-body"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script>
        const API_URL = typeof API_BASE_URL !== 'undefined' ? API_BASE_URL : 'http://localhost:8000/api';
        const token = localStorage.getItem('token');
        if (!token) window.location.href = 'login.html';

        async function loadStores() {
            try {
                const res = await fetch(`${API_URL}/admin/stores`, { headers: { 'Authorization': `Bearer ${token}` } });
                if(res.ok) {
                    const stores = await res.json();
                    const tbody = document.getElementById('stores-table-body');
                    
                    if(stores.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="5" class="p-4 text-center">Aucune boutique trouvée.</td></tr>';
                        return;
                    }

                    tbody.innerHTML = stores.map(s => `
                        <tr class="hover:bg-gray-50 transition-colors">
                            <td class="px-6 py-4 font-bold text-indigo-600">${s.name}</td>
                            <td class="px-6 py-4">${s.user ? s.user.name : 'Inconnu'}</td>
                            <td class="px-6 py-4 font-bold">${s.products_count || 0}</td>
                            <td class="px-6 py-4 text-gray-500">${new Date(s.created_at).toLocaleDateString('fr-FR')}</td>
                            <td class="px-6 py-4 flex items-center gap-3">
                                <a href="store-public.html?id=${s.id}" target="_blank" class="p-2 bg-blue-50 text-blue-600 rounded-lg hover:bg-blue-100 hover:text-blue-700 transition-colors" title="Voir la boutique">
                                    <i class="fas fa-eye"></i>
                                </a>
                                
                                <button onclick="deleteStore(${s.id})" class="p-2 bg-red-50 text-red-500 rounded-lg hover:bg-red-100 hover:text-red-700 transition-colors" title="Supprimer">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </td>
                        </tr>
                    `).join('');
                }
            } catch(e) { console.error(e); }
        }

        async function deleteStore(id) {
            if(!confirm("Supprimer cette boutique et tous ses produits ?")) return;
            await fetch(`${API_URL}/admin/stores/${id}`, { method: 'DELETE', headers: { 'Authorization': `Bearer ${token}` } });
            loadStores();
        }

        function logout(e) { e.preventDefault(); localStorage.clear(); window.location.href='index.html'; }
        loadStores();
    </script>
</body>
</html>
