<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tableau de bord - ShopCloud</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="assets/js/config.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        purple: { 50: '#faf5ff', 100: '#f3e8ff', 600: '#9333ea', 700: '#7e22ce' },
                        indigo: { 600: '#4f46e5' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">

    <div class="flex min-h-screen">
        
        <aside class="w-64 bg-white border-r border-gray-200 flex-shrink-0 fixed h-full z-10">
            <div class="p-6">
                <div class="flex items-center gap-3 mb-8">
                    <div class="w-10 h-10 bg-gradient-to-br from-purple-600 to-indigo-600 rounded-lg flex items-center justify-center text-white shadow-md">
                        <i class="fas fa-shopping-bag text-lg"></i>
                    </div>
                    <div>
                        <div class="text-gray-900 font-bold">Ma Boutique</div>
                        <div class="text-xs text-gray-500 font-medium uppercase tracking-wide">Propriétaire</div>
                    </div>
                </div>

                <nav class="space-y-2">
                    <a href="dashboard.html" class="flex items-center gap-3 px-4 py-3 bg-purple-50 text-purple-700 rounded-lg transition-colors font-medium">
                        <i class="fas fa-chart-pie w-5 text-center"></i>
                        <span>Tableau de bord</span>
                    </a>
                    <a href="store-products.html" class="flex items-center gap-3 px-4 py-3 text-gray-700 hover:bg-gray-50 rounded-lg transition-colors font-medium">
                        <i class="fas fa-box w-5 text-center"></i>
                        <span>Produits</span>
                    </a>
                    <a href="store-orders.html" class="flex items-center gap-3 px-4 py-3 text-gray-700 hover:bg-gray-50 rounded-lg transition-colors font-medium">
                        <i class="fas fa-shopping-cart w-5 text-center"></i>
                        <span>Commandes</span>
                    </a>
                    <a href="store-customization.html" class="flex items-center gap-3 px-4 py-3 text-gray-700 hover:bg-gray-50 rounded-lg transition-colors font-medium">
                        <i class="fas fa-paint-brush w-5 text-center"></i>
                        <span>Personnalisation</span>
                    </a>
                    
                    <a href="store-public.html" target="_blank" class="flex items-center gap-3 px-4 py-3 text-gray-700 hover:bg-gray-50 rounded-lg transition-colors font-medium">
                        <i class="fas fa-external-link-alt w-5 text-center"></i>
                        <span>Voir ma boutique</span>
                    </a>

                    <a href="index.html" class="flex items-center gap-3 px-4 py-3 text-gray-700 hover:bg-gray-50 rounded-lg transition-colors font-medium">
                        <i class="fas fa-home w-5 text-center"></i>
                        <span>Retour à l'accueil</span>
                    </a>

                    
                </nav>
            </div>
            
            <div class="absolute bottom-0 w-full p-6 border-t border-gray-100 bg-white">
                <a href="#" onclick="logout(event)" class="flex items-center gap-3 text-red-600 hover:bg-red-50 px-4 py-3 rounded-lg transition-colors font-medium">
                    <i class="fas fa-sign-out-alt w-5 text-center"></i>
                    <span>Déconnexion</span>
                </a>
            </div>
        </aside>

        <main class="flex-1 ml-64 p-8">
            <div class="max-w-7xl mx-auto">
                
                <div class="mb-8">
                    <h1 class="text-3xl font-bold text-gray-900 mb-2">Tableau de bord</h1>
                    <p class="text-gray-600">Aperçu de vos performances</p>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                    <div class="bg-white rounded-xl border border-gray-200 p-6 shadow-sm">
                        <div class="flex items-center justify-between mb-4">
                            <div class="w-12 h-12 bg-purple-100 rounded-lg flex items-center justify-center">
                                <i class="fas fa-euro-sign text-purple-600 text-xl"></i>
                            </div>
                        </div>
                        <div class="text-2xl font-bold text-gray-900 mb-1" id="stat-revenue">-- €</div>
                        <div class="text-sm text-gray-500">Revenus Totaux</div>
                    </div>

                    <div class="bg-white rounded-xl border border-gray-200 p-6 shadow-sm">
                        <div class="flex items-center justify-between mb-4">
                            <div class="w-12 h-12 bg-indigo-100 rounded-lg flex items-center justify-center">
                                <i class="fas fa-shopping-cart text-indigo-600 text-xl"></i>
                            </div>
                        </div>
                        <div class="text-2xl font-bold text-gray-900 mb-1" id="stat-sales">--</div>
                        <div class="text-sm text-gray-500">Articles Vendus</div>
                    </div>

                    <div class="bg-white rounded-xl border border-gray-200 p-6 shadow-sm">
                        <div class="flex items-center justify-between mb-4">
                            <div class="w-12 h-12 bg-blue-100 rounded-lg flex items-center justify-center">
                                <i class="fas fa-box text-blue-600 text-xl"></i>
                            </div>
                        </div>
                        <div class="text-2xl font-bold text-gray-900 mb-1" id="stat-products">--</div>
                        <div class="text-sm text-gray-500">Produits en ligne</div>
                    </div>
                </div>

                <div class="bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden">
                    <div class="p-6 border-b border-gray-200">
                        <h3 class="text-gray-900 font-bold">Ventes Récentes</h3>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left">
                            <thead class="bg-gray-50">
                                <tr>
                                    <th class="px-6 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wider">Produit</th>
                                    <th class="px-6 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wider">Client</th>
                                    <th class="px-6 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wider">Date</th>
                                    <th class="px-6 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wider">Montant</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-gray-200" id="recent-orders-body">
                                <tr><td colspan="4" class="px-6 py-4 text-center text-gray-500">Chargement...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script>
        const API_URL = 'http://localhost:8000/api';
        const token = localStorage.getItem('token');

        if (!token) window.location.href = 'login.html';

        function logout(e) {
            e.preventDefault();
            localStorage.clear();
            window.location.href = 'index.html';
        }

        async function loadDashboard() {
            try {
                // 1. Fetch Stats
                const statsRes = await fetch(`${API_URL}/vendor/stats`, {
                    headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'application/json' }
                });
                
                if (statsRes.ok) {
                    const stats = await statsRes.json();
                    document.getElementById('stat-revenue').innerText = parseFloat(stats.revenue || 0).toFixed(2) + ' €';
                    document.getElementById('stat-products').innerText = stats.products || 0;
                    document.getElementById('stat-sales').innerText = stats.sales || 0;
                }

                // 2. Fetch Recent Orders
                const ordersRes = await fetch(`${API_URL}/vendor/orders/recent`, {
                    headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'application/json' }
                });

                if (ordersRes.ok) {
                    const items = await ordersRes.json();
                    const tbody = document.getElementById('recent-orders-body');
                    
                    if (items.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="4" class="px-6 py-4 text-center text-gray-500">Aucune vente récente.</td></tr>';
                    } else {
                        tbody.innerHTML = items.map(item => `
                            <tr class="hover:bg-gray-50 transition-colors">
                                <td class="px-6 py-4 text-gray-900 font-medium">${item.product ? item.product.name : 'Produit supprimé'}</td>
                                <td class="px-6 py-4 text-gray-600">${item.order && item.order.user ? item.order.user.name : 'Client'}</td>
                                <td class="px-6 py-4 text-gray-500">${new Date(item.created_at).toLocaleDateString()}</td>
                                <td class="px-6 py-4 text-gray-900 font-bold">${(item.price * item.quantity).toFixed(2)} €</td>
                            </tr>
                        `).join('');
                    }
                }
            } catch (error) {
                console.error("Dashboard Error:", error);
            }
        }

        loadDashboard();
    </script>
</body>
</html>
