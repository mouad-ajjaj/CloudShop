<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Détail Produit - ShopCloud</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="assets/js/config.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        indigo: { 50: '#f3eefc', 100: '#d8cbf7', 500: '#8e44ad', 600: '#6f42c1', 700: '#5a32a3' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 text-gray-900">

    <header class="bg-white border-b border-gray-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 py-4">
            <div class="flex items-center justify-between gap-8">
                <a href="index.html" class="flex items-center gap-2 text-decoration-none">
                    <div class="w-10 h-10 bg-gradient-to-br from-indigo-600 to-purple-600 rounded-lg flex items-center justify-center text-white shadow-lg">
                        <i class="fas fa-shopping-cart text-lg"></i>
                    </div>
                    <span class="text-xl font-bold text-indigo-600 tracking-tight">ShopCloud</span>
                </a>
                <div class="flex items-center gap-4">
                    <a href="cart.html" class="relative p-3 text-gray-600 hover:bg-indigo-50 hover:text-indigo-600 rounded-lg transition-colors">
                        <i class="fas fa-shopping-cart text-xl"></i>
                    </a>
                </div>
            </div>
        </div>
    </header>

    <div class="max-w-7xl mx-auto px-6 py-12">
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-12 mb-16" id="product-container">
            <div class="animate-pulse bg-gray-200 h-96 rounded-2xl"></div>
            <div class="space-y-4">
                <div class="h-8 bg-gray-200 rounded w-1/2"></div>
                <div class="h-6 bg-gray-200 rounded w-1/4"></div>
                <div class="h-32 bg-gray-200 rounded"></div>
            </div>
        </div>

        <section class="border-t border-gray-200 pt-16">
            <h2 class="text-2xl font-bold text-gray-900 mb-8">Produits similaires</h2>
            <div id="related-products" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                <p class="text-gray-500 col-span-full">Recherche de produits similaires...</p>
            </div>
        </section>
    </div>

    <script>
        const API = typeof API_BASE_URL !== 'undefined' ? API_BASE_URL : 'http://localhost:8000/api';
        const urlParams = new URLSearchParams(window.location.search);
        const productId = urlParams.get('id');

        // Helper to format image URLs properly
        function getImageUrl(path) {
            if (!path) return 'https://via.placeholder.com/800x800?text=No+Image';
            return path.startsWith('http') ? path : `http://localhost:8000/storage/${path}`;
        }

        // --- 1. Load Main Product ---
        async function loadProduct() {
            if (!productId) {
                alert("Produit non spécifié");
                window.location.href = 'index.html';
                return;
            }

            try {
                const res = await fetch(`${API}/products/${productId}`);
                if (!res.ok) throw new Error("Produit introuvable");
                
                const product = await res.json();
                renderProductDetails(product);
                
                // Once main product is loaded, fetch related items using its category
                loadRelatedProducts(product.category, product.id);

            } catch (e) {
                console.error(e);
                document.getElementById('product-container').innerHTML = `
                    <div class="col-span-2 text-center py-20">
                        <h1 class="text-3xl font-bold text-gray-300 mb-4">Produit introuvable</h1>
                        <a href="index.html" class="text-indigo-600 hover:underline">Retour à l'accueil</a>
                    </div>
                `;
            }
        }

        // --- 2. Render Main Product (WITH GALLERY) ---
        function renderProductDetails(p) {
            document.title = `${p.name} - ShopCloud`;
            
            // 1. Get Main Image
            const mainImage = p.image ? getImageUrl(p.image) : 'https://via.placeholder.com/800';
            const price = parseFloat(p.price).toFixed(2);
            
            // 2. Parse Extra Images safely
            let extraImages = [];
            if (Array.isArray(p.images)) {
                extraImages = p.images;
            } else if (typeof p.images === 'string') {
                try { extraImages = JSON.parse(p.images); } catch(e) {}
            }

            // 3. Combine Main + Extras for the gallery list
            // We use Set to remove duplicates if main image is also in the list
            const allImagesRaw = [p.image, ...extraImages].filter(Boolean);
            const allImages = [...new Set(allImagesRaw)]; 

            // 4. Generate Thumbnails HTML
            const thumbnailsHtml = allImages.map((img, index) => {
                const src = getImageUrl(img);
                return `
                    <div onclick="changeMainImage('${src}')" class="aspect-square bg-white rounded-xl border border-gray-200 overflow-hidden cursor-pointer hover:border-indigo-600 transition-all p-1">
                        <img src="${src}" class="w-full h-full object-cover rounded-lg">
                    </div>
                `;
            }).join('');

            const html = `
                <div class="space-y-4">
                    <div class="bg-white rounded-2xl border border-gray-200 overflow-hidden shadow-sm aspect-square relative flex items-center justify-center bg-gray-50">
                        <img id="main-display-img" src="${mainImage}" alt="${p.name}" class="max-h-full max-w-full object-contain">
                    </div>
                    
                    ${allImages.length > 1 ? `<div class="grid grid-cols-5 gap-4">${thumbnailsHtml}</div>` : ''}
                </div>

                <div>
                    <div class="mb-6">
                        <span class="inline-block px-3 py-1 bg-indigo-50 text-indigo-700 rounded-full text-xs font-bold uppercase tracking-wide mb-4 border border-indigo-100">
                            ${p.category || 'Général'}
                        </span>
                        <h1 class="text-4xl font-extrabold text-gray-900 mb-4 leading-tight">${p.name}</h1>
                        <div class="text-4xl font-bold text-indigo-600 mb-6">${price} €</div>
                    </div>

                    <div class="prose prose-gray mb-8 text-gray-600 leading-relaxed">
                        <p>${p.description || "Aucune description détaillée disponible pour ce produit."}</p>
                    </div>

                    <div class="grid grid-cols-3 gap-4 mb-8">
                        <div class="flex flex-col items-center justify-center p-4 bg-white border border-gray-100 rounded-xl text-center shadow-sm">
                            <i class="fas fa-truck text-indigo-600 text-2xl mb-2"></i>
                            <div class="text-xs font-bold text-gray-900 uppercase">Livraison</div>
                            <div class="text-xs text-gray-500">Rapide</div>
                        </div>
                        <div class="flex flex-col items-center justify-center p-4 bg-white border border-gray-100 rounded-xl text-center shadow-sm">
                            <i class="fas fa-shield-alt text-indigo-600 text-2xl mb-2"></i>
                            <div class="text-xs font-bold text-gray-900 uppercase">Garantie</div>
                            <div class="text-xs text-gray-500">Incluse</div>
                        </div>
                        <div class="flex flex-col items-center justify-center p-4 bg-white border border-gray-100 rounded-xl text-center shadow-sm">
                            <i class="fas fa-undo text-indigo-600 text-2xl mb-2"></i>
                            <div class="text-xs font-bold text-gray-900 uppercase">Retour</div>
                            <div class="text-xs text-gray-500">Simple</div>
                        </div>
                    </div>

                    <div class="flex flex-col sm:flex-row gap-4 mb-6">
                        <div class="flex items-center border-2 border-gray-200 rounded-xl bg-white w-32">
                            <button onclick="updateQty(-1)" class="px-3 py-3 hover:bg-gray-50 text-gray-500"><i class="fas fa-minus"></i></button>
                            <input type="number" id="qty-input" value="1" class="w-full text-center border-none focus:ring-0 font-bold text-gray-900 bg-transparent p-0" readonly>
                            <button onclick="updateQty(1)" class="px-3 py-3 hover:bg-gray-50 text-gray-500"><i class="fas fa-plus"></i></button>
                        </div>
                        <button onclick="addToCart('${p.id}', '${p.name.replace(/'/g, "\\'")}', '${price}', '${mainImage}')" class="flex-1 px-8 py-4 bg-indigo-600 text-white rounded-xl font-bold hover:bg-indigo-700 transition-all shadow-lg hover:shadow-indigo-200 flex items-center justify-center gap-2">
                            <i class="fas fa-shopping-bag"></i> Ajouter au panier
                        </button>
                    </div>
                </div>
            `;
            document.getElementById('product-container').innerHTML = html;
        }

        // --- 3. Click-to-Swap Image Logic ---
        window.changeMainImage = function(src) {
            document.getElementById('main-display-img').src = src;
        }

        // --- 4. Load Related Products ---
        async function loadRelatedProducts(category, currentId) {
            const container = document.getElementById('related-products');
            try {
                const res = await fetch(`${API}/products?limit=20`);
                if (!res.ok) throw new Error("API Error");
                
                const allProducts = await res.json();
                
                const related = allProducts.filter(p => 
                    p.category === category && p.id !== currentId
                ).slice(0, 4); 

                if (related.length === 0) {
                    container.innerHTML = `<p class="col-span-full text-gray-400 italic">Aucun autre produit similaire trouvé.</p>`;
                    return;
                }

                container.innerHTML = related.map(p => {
                    const img = getImageUrl(p.image);
                    const price = parseFloat(p.price).toFixed(2);
                    return `
                        <div class="bg-white rounded-xl border border-gray-200 overflow-hidden hover:shadow-lg transition-all duration-300 cursor-pointer group" onclick="window.location.href='product-detail.html?id=${p.id}'">
                            <div class="aspect-[4/3] bg-gray-100 overflow-hidden relative">
                                <img src="${img}" alt="${p.name}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                            </div>
                            <div class="p-4">
                                <h3 class="text-gray-900 font-bold mb-2 group-hover:text-indigo-600 transition-colors line-clamp-1">${p.name}</h3>
                                <div class="flex items-center justify-between">
                                    <span class="text-lg font-bold text-indigo-600">${price} €</span>
                                    <button class="w-8 h-8 bg-indigo-50 text-indigo-600 rounded-full flex items-center justify-center hover:bg-indigo-600 hover:text-white transition-colors">
                                        <i class="fas fa-arrow-right text-xs"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');

            } catch (e) {
                console.error("Error loading related products", e);
                container.innerHTML = "";
            }
        }

        // --- Utilities ---
        function updateQty(change) {
            const input = document.getElementById('qty-input');
            let val = parseInt(input.value) + change;
            if (val < 1) val = 1;
            input.value = val;
        }

        function addToCart(id, name, price, image) {
            let cart = JSON.parse(localStorage.getItem('cart') || '[]');
            const qty = parseInt(document.getElementById('qty-input').value);
            const existing = cart.find(item => item.id == id);
            
            if (existing) {
                existing.quantity += qty;
            } else {
                cart.push({ id, name, price, image, quantity: qty });
            }
            localStorage.setItem('cart', JSON.stringify(cart));
            
            // Visual Feedback
            const btn = document.querySelector('button[onclick^="addToCart"]');
            const originalHTML = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-check"></i> Ajouté !';
            btn.classList.add('bg-green-600', 'hover:bg-green-700');
            btn.classList.remove('bg-indigo-600', 'hover:bg-indigo-700');
            
            setTimeout(() => {
                btn.innerHTML = originalHTML;
                btn.classList.remove('bg-green-600', 'hover:bg-green-700');
                btn.classList.add('bg-indigo-600', 'hover:bg-indigo-700');
            }, 2000);
        }

        // Start
        loadProduct();
    </script>
</body>
</html>
