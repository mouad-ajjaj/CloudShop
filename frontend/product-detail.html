<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Détail Produit - ShopCloud</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="assets/js/config.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        indigo: { 50: '#f3eefc', 100: '#d8cbf7', 500: '#8e44ad', 600: '#6f42c1', 700: '#5a32a3' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 text-gray-900">

    <header class="bg-white border-b border-gray-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 py-4">
            <div class="flex items-center justify-between gap-8">
                <a href="index.html" class="flex items-center gap-2 text-decoration-none">
                    <div class="w-10 h-10 bg-gradient-to-br from-indigo-600 to-purple-600 rounded-lg flex items-center justify-center text-white shadow-lg">
                        <i class="fas fa-shopping-cart text-lg"></i>
                    </div>
                    <span class="text-xl font-bold text-indigo-600 tracking-tight">ShopCloud</span>
                </a>
                <div class="flex items-center gap-4">
                    <a href="cart.html" class="relative p-3 text-gray-600 hover:bg-indigo-50 hover:text-indigo-600 rounded-lg transition-colors">
                        <i class="fas fa-shopping-cart text-xl"></i>
                    </a>
                </div>
            </div>
        </div>
    </header>

    <div class="max-w-7xl mx-auto px-6 py-12">
        
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-12 mb-16" id="product-container">
            <div class="animate-pulse bg-gray-200 h-96 rounded-2xl"></div>
            <div class="space-y-4">
                <div class="h-8 bg-gray-200 rounded w-1/2"></div>
                <div class="h-32 bg-gray-200 rounded"></div>
            </div>
        </div>

        <section class="border-t border-gray-200 pt-16 mb-16" id="reviews-section">
            <div class="flex items-center justify-between mb-8">
                <h2 class="text-2xl font-bold text-gray-900">Avis Clients</h2>
                <div class="flex items-center gap-3">
                    <span class="text-4xl font-bold text-gray-900" id="avg-rating">--</span>
                    <div class="flex flex-col">
                        <div class="text-yellow-400 text-lg" id="avg-stars"></div>
                        <span class="text-sm text-gray-500" id="total-reviews">(0 avis)</span>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-12">
                <div class="lg:col-span-1">
                    <div id="review-form-container" class="bg-white p-6 rounded-xl border border-gray-200 shadow-sm sticky top-24 hidden">
                        <h3 class="font-bold text-lg mb-4 text-gray-900">Donnez votre avis</h3>
                        <form id="review-form">
                            <div class="mb-4">
                                <label class="block text-sm font-medium text-gray-700 mb-2">Votre note</label>
                                <div class="flex gap-1 text-2xl text-gray-300 cursor-pointer" id="star-selector">
                                    <i class="fas fa-star hover:text-yellow-400 transition-colors" data-value="1"></i>
                                    <i class="fas fa-star hover:text-yellow-400 transition-colors" data-value="2"></i>
                                    <i class="fas fa-star hover:text-yellow-400 transition-colors" data-value="3"></i>
                                    <i class="fas fa-star hover:text-yellow-400 transition-colors" data-value="4"></i>
                                    <i class="fas fa-star hover:text-yellow-400 transition-colors" data-value="5"></i>
                                </div>
                                <input type="hidden" id="rating-input" required>
                            </div>
                            <div class="mb-4">
                                <label class="block text-sm font-medium text-gray-700 mb-2">Commentaire</label>
                                <textarea id="comment-input" rows="4" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none text-sm" placeholder="Partagez votre expérience..." required></textarea>
                            </div>
                            <button type="submit" class="w-full py-3 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 font-bold transition-colors shadow-md">Publier l'avis</button>
                        </form>
                    </div>

                    <div id="login-prompt" class="bg-gray-50 p-8 rounded-xl border border-gray-200 text-center hidden">
                        <div class="w-12 h-12 bg-indigo-100 rounded-full flex items-center justify-center mx-auto mb-4 text-indigo-600">
                            <i class="fas fa-lock"></i>
                        </div>
                        <p class="text-gray-900 font-medium mb-2">Connectez-vous</p>
                        <p class="text-sm text-gray-500 mb-6">Vous devez être connecté pour laisser un avis sur ce produit.</p>
                        <a href="login.html" class="inline-block px-6 py-2.5 bg-white border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-50 font-medium transition-colors w-full">Se connecter</a>
                    </div>
                </div>

                <div class="lg:col-span-2 space-y-6" id="reviews-list">
                    <p class="text-gray-500 italic">Chargement des avis...</p>
                </div>
            </div>
        </section>

        <section class="border-t border-gray-200 pt-16">
            <h2 class="text-2xl font-bold text-gray-900 mb-8">Produits similaires</h2>
            <div id="related-products" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                </div>
        </section>
    </div>

    <script>
        const API = typeof API_BASE_URL !== 'undefined' ? API_BASE_URL : 'http://localhost:8000/api';
        const urlParams = new URLSearchParams(window.location.search);
        const productId = urlParams.get('id');
        const token = localStorage.getItem('token');

        function getImageUrl(path) {
            if (!path) return 'https://via.placeholder.com/800x800?text=No+Image';
            return path.startsWith('http') ? path : `http://localhost:8000/storage/${path}`;
        }

        // --- 1. Load Main Product ---
        async function loadProduct() {
            if (!productId) {
                alert("Produit non spécifié");
                window.location.href = 'index.html';
                return;
            }

            try {
                const res = await fetch(`${API}/products/${productId}`);
                if (!res.ok) throw new Error("Produit introuvable");
                
                const product = await res.json();
                renderProductDetails(product);
                
                // Load additional data
                loadRelatedProducts(product.category, product.id);
                loadReviews(); 

            } catch (e) {
                console.error(e);
                document.getElementById('product-container').innerHTML = `
                    <div class="col-span-2 text-center py-20">
                        <h1 class="text-3xl font-bold text-gray-300 mb-4">Produit introuvable</h1>
                        <a href="index.html" class="text-indigo-600 hover:underline">Retour à l'accueil</a>
                    </div>
                `;
            }
        }

        // --- 2. Render Details (With Store Link) ---
        function renderProductDetails(p) {
            document.title = `${p.name} - ShopCloud`;
            
            const mainImage = p.image ? getImageUrl(p.image) : 'https://via.placeholder.com/800';
            const price = parseFloat(p.price).toFixed(2);
            const storeName = p.store ? p.store.name : 'Boutique Inconnue';
            const storeId = p.store ? p.store.id : null;

            // Gallery Logic
            let extraImages = [];
            if (Array.isArray(p.images)) extraImages = p.images;
            else if (typeof p.images === 'string') try { extraImages = JSON.parse(p.images); } catch(e) {}
            
            const allImagesRaw = [p.image, ...extraImages].filter(Boolean);
            const allImages = [...new Set(allImagesRaw)]; 

            const thumbnailsHtml = allImages.map(img => `
                <div onclick="changeMainImage('${getImageUrl(img)}')" class="aspect-square bg-white rounded-xl border border-gray-200 overflow-hidden cursor-pointer hover:border-indigo-600 transition-all p-1">
                    <img src="${getImageUrl(img)}" class="w-full h-full object-cover rounded-lg">
                </div>
            `).join('');

            const html = `
                <div class="space-y-4">
                    <div class="bg-white rounded-2xl border border-gray-200 overflow-hidden shadow-sm aspect-square relative flex items-center justify-center bg-gray-50">
                        <img id="main-display-img" src="${mainImage}" alt="${p.name}" class="max-h-full max-w-full object-contain">
                    </div>
                    ${allImages.length > 1 ? `<div class="grid grid-cols-5 gap-4">${thumbnailsHtml}</div>` : ''}
                </div>

                <div>
                    <div class="mb-6">
                        <div class="flex justify-between items-start mb-2">
                            <span class="inline-block px-3 py-1 bg-indigo-50 text-indigo-700 rounded-full text-xs font-bold uppercase tracking-wide border border-indigo-100">
                                ${p.category || 'Général'}
                            </span>
                            
                            ${storeId ? `
                            <a href="store-public.html?id=${storeId}" class="flex items-center gap-2 text-sm text-gray-500 hover:text-indigo-600 transition-colors border border-gray-200 rounded-lg px-3 py-1 bg-white hover:border-indigo-200 shadow-sm">
                                <i class="fas fa-store text-indigo-500"></i> <span class="font-medium">Vendu par ${storeName}</span>
                            </a>` : ''}
                        </div>

                        <h1 class="text-4xl font-extrabold text-gray-900 mb-4 leading-tight">${p.name}</h1>
                        <div class="text-4xl font-bold text-indigo-600 mb-6">${price} €</div>
                    </div>

                    <div class="prose prose-gray mb-8 text-gray-600 leading-relaxed">
                        <p>${p.description || "Aucune description détaillée disponible pour ce produit."}</p>
                    </div>

                    <div class="flex flex-col sm:flex-row gap-4 mb-6">
                        <div class="flex items-center border-2 border-gray-200 rounded-xl bg-white w-32">
                            <button onclick="updateQty(-1)" class="px-3 py-3 hover:bg-gray-50 text-gray-500"><i class="fas fa-minus"></i></button>
                            <input type="number" id="qty-input" value="1" class="w-full text-center border-none focus:ring-0 font-bold text-gray-900 bg-transparent p-0" readonly>
                            <button onclick="updateQty(1)" class="px-3 py-3 hover:bg-gray-50 text-gray-500"><i class="fas fa-plus"></i></button>
                        </div>
                        <button onclick="addToCart('${p.id}', '${p.name.replace(/'/g, "\\'")}', '${price}', '${mainImage}')" class="flex-1 px-8 py-4 bg-indigo-600 text-white rounded-xl font-bold hover:bg-indigo-700 transition-all shadow-lg hover:shadow-indigo-200 flex items-center justify-center gap-2">
                            <i class="fas fa-shopping-bag"></i> Ajouter au panier
                        </button>
                    </div>

                    <div class="grid grid-cols-3 gap-4 border-t border-gray-100 pt-6">
                        <div class="text-center">
                            <i class="fas fa-truck text-indigo-600 text-xl mb-1"></i>
                            <div class="text-xs font-bold uppercase text-gray-700">Livraison</div>
                            <div class="text-xs text-gray-500">Rapide</div>
                        </div>
                        <div class="text-center border-l border-gray-100">
                            <i class="fas fa-shield-alt text-indigo-600 text-xl mb-1"></i>
                            <div class="text-xs font-bold uppercase text-gray-700">Sécurité</div>
                            <div class="text-xs text-gray-500">100% sûr</div>
                        </div>
                        <div class="text-center border-l border-gray-100">
                            <i class="fas fa-undo text-indigo-600 text-xl mb-1"></i>
                            <div class="text-xs font-bold uppercase text-gray-700">Retour</div>
                            <div class="text-xs text-gray-500">Simple</div>
                        </div>
                    </div>
                </div>
            `;
            document.getElementById('product-container').innerHTML = html;
        }

        // --- 3. REVIEWS LOGIC ---
        async function loadReviews() {
            const list = document.getElementById('reviews-list');
            
            // Toggle form visibility
            if(token) {
                document.getElementById('review-form-container').classList.remove('hidden');
            } else {
                document.getElementById('login-prompt').classList.remove('hidden');
            }

            try {
                const res = await fetch(`${API}/products/${productId}/reviews`);
                if(!res.ok) throw new Error("API Error");
                const reviews = await res.json();

                // Calculate Stats
                if(reviews.length > 0) {
                    const avg = reviews.reduce((acc, r) => acc + r.rating, 0) / reviews.length;
                    document.getElementById('avg-rating').innerText = avg.toFixed(1);
                    document.getElementById('avg-stars').innerHTML = renderStars(avg);
                    document.getElementById('total-reviews').innerText = `(${reviews.length} avis)`;
                } else {
                    document.getElementById('avg-rating').innerText = "0.0";
                    document.getElementById('avg-stars').innerHTML = renderStars(0);
                }

                if(reviews.length === 0) {
                    list.innerHTML = `<div class="text-center py-8 text-gray-500 bg-gray-50 rounded-xl border border-dashed border-gray-200">Aucun avis pour le moment. Soyez le premier !</div>`;
                    return;
                }

                list.innerHTML = reviews.map(r => `
                    <div class="bg-white p-6 rounded-xl border border-gray-100 shadow-sm">
                        <div class="flex items-center justify-between mb-3">
                            <div class="flex items-center gap-3">
                                <div class="w-10 h-10 bg-indigo-50 rounded-full flex items-center justify-center font-bold text-indigo-600">
                                    ${r.user.name.charAt(0).toUpperCase()}
                                </div>
                                <div>
                                    <p class="font-bold text-gray-900 text-sm">${r.user.name}</p>
                                    <p class="text-xs text-gray-400">${new Date(r.created_at).toLocaleDateString()}</p>
                                </div>
                            </div>
                            <div class="text-yellow-400 text-sm">${renderStars(r.rating)}</div>
                        </div>
                        <p class="text-gray-600 text-sm leading-relaxed">${r.comment}</p>
                    </div>
                `).join('');

            } catch(e) {
                console.error(e);
                list.innerHTML = `<p class="text-red-500 text-sm">Impossible de charger les avis.</p>`;
            }
        }

        // Render Star Icons
        function renderStars(rating) {
            let html = '';
            for(let i=1; i<=5; i++) {
                if(i <= rating) html += '<i class="fas fa-star"></i>';
                else if(i - 0.5 <= rating) html += '<i class="fas fa-star-half-alt"></i>';
                else html += '<i class="far fa-star text-gray-300"></i>';
            }
            return html;
        }

        // Star Input Logic (Form)
        const stars = document.querySelectorAll('#star-selector i');
        stars.forEach(star => {
            star.addEventListener('click', function() {
                const val = this.dataset.value;
                document.getElementById('rating-input').value = val;
                stars.forEach(s => {
                    if(s.dataset.value <= val) {
                        s.classList.remove('text-gray-300');
                        s.classList.add('text-yellow-400');
                    } else {
                        s.classList.add('text-gray-300');
                        s.classList.remove('text-yellow-400');
                    }
                });
            });
        });

        // Submit Review Logic
        document.getElementById('review-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const rating = document.getElementById('rating-input').value;
            const comment = document.getElementById('comment-input').value;

            if(!rating) { alert("Veuillez sélectionner une note."); return; }

            const btn = e.target.querySelector('button');
            const originalText = btn.innerText;
            btn.innerText = "Envoi...";
            btn.disabled = true;

            try {
                const res = await fetch(`${API}/products/${productId}/reviews`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ rating, comment })
                });

                const data = await res.json();

                if(res.ok) {
                    // Reset form and reload reviews
                    document.getElementById('review-form').reset();
                    stars.forEach(s => { s.classList.add('text-gray-300'); s.classList.remove('text-yellow-400'); });
                    loadReviews();
                    alert("Merci pour votre avis !");
                } else {
                    alert(data.message || "Erreur lors de l'envoi.");
                }
            } catch(e) {
                console.error(e);
                alert("Erreur serveur.");
            } finally {
                btn.innerText = originalText;
                btn.disabled = false;
            }
        });

        // --- 4. Utilities ---
        window.changeMainImage = function(src) {
            document.getElementById('main-display-img').src = src;
        }

        async function loadRelatedProducts(category, currentId) {
            const container = document.getElementById('related-products');
            try {
                const res = await fetch(`${API}/products?limit=20`);
                if (!res.ok) throw new Error("API Error");
                const allProducts = await res.json();
                const related = allProducts.filter(p => p.category === category && p.id !== currentId).slice(0, 4); 
                
                if(related.length === 0) { container.innerHTML = `<p class="col-span-full text-gray-400 italic">Aucun produit similaire.</p>`; return; }

                container.innerHTML = related.map(p => {
                    const img = getImageUrl(p.image);
                    const price = parseFloat(p.price).toFixed(2);
                    return `
                        <div class="bg-white rounded-xl border border-gray-200 overflow-hidden hover:shadow-lg transition-all duration-300 cursor-pointer group" onclick="window.location.href='product-detail.html?id=${p.id}'">
                            <div class="aspect-[4/3] bg-gray-100 overflow-hidden relative"><img src="${img}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500"></div>
                            <div class="p-4"><h3 class="text-gray-900 font-bold mb-2 group-hover:text-indigo-600 line-clamp-1">${p.name}</h3><span class="text-lg font-bold text-indigo-600">${price} €</span></div>
                        </div>
                    `;
                }).join('');
            } catch (e) { console.error(e); }
        }

        function updateQty(change) {
            const input = document.getElementById('qty-input');
            let val = parseInt(input.value) + change;
            if (val < 1) val = 1;
            input.value = val;
        }

        function addToCart(id, name, price, image) {
            let cart = JSON.parse(localStorage.getItem('cart') || '[]');
            const qty = parseInt(document.getElementById('qty-input').value);
            const existing = cart.find(item => item.id == id);
            if (existing) existing.quantity += qty;
            else cart.push({ id, name, price, image, quantity: qty });
            localStorage.setItem('cart', JSON.stringify(cart));
            
            const btn = document.querySelector('button[onclick^="addToCart"]');
            const originalHTML = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-check"></i> Ajouté !';
            btn.classList.add('bg-green-600', 'hover:bg-green-700');
            setTimeout(() => {
                btn.innerHTML = originalHTML;
                btn.classList.remove('bg-green-600', 'hover:bg-green-700');
            }, 2000);
        }

        // Start
        loadProduct();
    </script>
</body>
</html>
