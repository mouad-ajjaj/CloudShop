<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Panier - ShopCloud</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="assets/js/config.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        indigo: { 50: '#f3eefc', 100: '#d8cbf7', 500: '#8e44ad', 600: '#6f42c1', 700: '#5a32a3' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">

    <header class="bg-white border-b border-gray-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 py-4">
            <div class="flex items-center justify-between gap-8">
                <a href="index.html" class="flex items-center gap-2 text-decoration-none">
                    <div class="w-10 h-10 bg-gradient-to-br from-indigo-600 to-purple-600 rounded-lg flex items-center justify-center text-white shadow-lg">
                        <i class="fas fa-shopping-cart text-lg"></i>
                    </div>
                    <span class="text-xl font-bold text-indigo-600 tracking-tight">ShopCloud</span>
                </a>

                <div class="flex items-center gap-4">
                    <a href="cart.html" class="relative p-3 text-gray-600 hover:bg-indigo-50 hover:text-indigo-600 rounded-lg transition-colors">
                        <i class="fas fa-shopping-cart text-xl"></i>
                        <span id="cart-badge" class="absolute top-1 right-1 w-5 h-5 bg-red-500 text-white text-xs font-bold rounded-full flex items-center justify-center border-2 border-white opacity-0 transition-opacity">0</span>
                    </a>
                    
                    <div id="auth-section">
                        <a href="login.html" class="flex items-center gap-2 px-5 py-2.5 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition-all shadow-md shadow-indigo-200 font-medium">
                            <i class="far fa-user"></i>
                            <span>Connexion</span>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <div class="max-w-7xl mx-auto px-6 py-12">
        <h1 class="text-3xl font-bold text-gray-900 mb-8">Mon Panier</h1>

        <div class="flex flex-col lg:flex-row gap-8">
            
            <div class="flex-1">
                <div id="cart-container" class="bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden">
                    <div class="p-12 text-center">
                        <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-indigo-600 mx-auto"></div>
                    </div>
                </div>
            </div>

            <div class="w-full lg:w-96 flex-shrink-0">
                <div class="bg-white rounded-xl border border-gray-200 p-6 shadow-sm sticky top-24">
                    <h2 class="text-lg font-bold text-gray-900 mb-6">Résumé de commande</h2>
                    
                    <div class="space-y-4 border-b border-gray-100 pb-6">
                        <div class="flex justify-between text-gray-600">
                            <span>Sous-total</span>
                            <span id="summary-subtotal">0.00 €</span>
                        </div>
                        <div class="flex justify-between text-gray-600">
                            <span>Livraison</span>
                            <span class="text-green-600 font-medium">Gratuite</span>
                        </div>
                    </div>

                    <div class="flex justify-between items-center py-6">
                        <span class="text-lg font-bold text-gray-900">Total</span>
                        <span class="text-2xl font-bold text-indigo-600" id="summary-total">0.00 €</span>
                    </div>

                    <button onclick="checkout()" class="w-full py-4 bg-indigo-600 text-white rounded-xl font-bold hover:bg-indigo-700 transition-all shadow-lg hover:shadow-indigo-200">
                        Passer la commande
                    </button>

                    <div class="mt-6 space-y-3">
                        <div class="flex items-center gap-3 text-sm text-gray-500">
                            <i class="fas fa-shield-alt text-green-500"></i> Paiement 100% sécurisé
                        </div>
                        <div class="flex items-center gap-3 text-sm text-gray-500">
                            <i class="fas fa-truck text-blue-500"></i> Livraison gratuite dès 50€
                        </div>
                        <div class="flex items-center gap-3 text-sm text-gray-500">
                            <i class="fas fa-undo text-indigo-500"></i> Retour gratuit sous 30 jours
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        const API = typeof API_BASE_URL !== 'undefined' ? API_BASE_URL : 'http://localhost:8000/api';
        
        // --- 1. Load Cart Logic ---
        function loadCart() {
            checkAuth(); // Update header auth state
            
            const cart = JSON.parse(localStorage.getItem('cart') || '[]');
            updateCartBadge(cart);
            renderCartItems(cart);
            updateSummary(cart);
        }

        // --- 2. Render Items ---
        function renderCartItems(cart) {
            const container = document.getElementById('cart-container');

            if (cart.length === 0) {
                container.innerHTML = `
                    <div class="p-12 text-center flex flex-col items-center">
                        <div class="w-20 h-20 bg-gray-50 rounded-full flex items-center justify-center mb-6">
                            <i class="fas fa-shopping-basket text-3xl text-gray-300"></i>
                        </div>
                        <h3 class="text-xl font-bold text-gray-900 mb-2">Votre panier est vide</h3>
                        <p class="text-gray-500 mb-8">Découvrez nos meilleures offres et commencez à magasiner !</p>
                        <a href="index.html" class="px-8 py-3 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition-colors font-medium">
                            Retour à la boutique
                        </a>
                    </div>
                `;
                return;
            }

            container.innerHTML = cart.map((item, index) => {
                const itemTotal = (parseFloat(item.price) * item.quantity).toFixed(2);
                const image = item.image || 'https://via.placeholder.com/150';

                return `
                <div class="flex flex-col sm:flex-row items-center gap-6 p-6 border-b border-gray-100 last:border-0 hover:bg-gray-50 transition-colors">
                    <div class="w-24 h-24 bg-gray-100 rounded-lg overflow-hidden flex-shrink-0 border border-gray-200">
                        <img src="${image}" class="w-full h-full object-cover">
                    </div>

                    <div class="flex-1 text-center sm:text-left">
                        <h3 class="font-bold text-gray-900 mb-1 text-lg">${item.name}</h3>
                        <p class="text-gray-500 text-sm">Prix unitaire: ${parseFloat(item.price).toFixed(2)} €</p>
                    </div>

                    <div class="flex items-center gap-6">
                        <div class="flex items-center border border-gray-300 rounded-lg bg-white h-10">
                            <button onclick="updateQty(${index}, -1)" class="w-10 h-full flex items-center justify-center hover:bg-gray-50 text-gray-600 rounded-l-lg transition-colors">
                                <i class="fas fa-minus text-xs"></i>
                            </button>
                            <input type="text" value="${item.quantity}" readonly class="w-12 text-center text-sm font-bold text-gray-900 border-x border-gray-100 h-full outline-none">
                            <button onclick="updateQty(${index}, 1)" class="w-10 h-full flex items-center justify-center hover:bg-gray-50 text-gray-600 rounded-r-lg transition-colors">
                                <i class="fas fa-plus text-xs"></i>
                            </button>
                        </div>

                        <div class="text-right min-w-[80px]">
                            <div class="font-bold text-indigo-600 text-lg">${itemTotal} €</div>
                        </div>

                        <button onclick="removeItem(${index})" class="w-10 h-10 rounded-full hover:bg-red-50 text-gray-400 hover:text-red-500 transition-colors flex items-center justify-center" title="Supprimer">
                            <i class="fas fa-trash-alt"></i>
                        </button>
                    </div>
                </div>
                `;
            }).join('');
        }

        // --- 3. Actions ---
        function updateQty(index, change) {
            let cart = JSON.parse(localStorage.getItem('cart') || '[]');
            if (cart[index]) {
                cart[index].quantity += change;
                if (cart[index].quantity < 1) cart[index].quantity = 1; // Min 1
            }
            saveAndRefresh(cart);
        }

        function removeItem(index) {
            if(!confirm("Supprimer cet article ?")) return;
            let cart = JSON.parse(localStorage.getItem('cart') || '[]');
            cart.splice(index, 1);
            saveAndRefresh(cart);
        }

        function saveAndRefresh(cart) {
            localStorage.setItem('cart', JSON.stringify(cart));
            updateCartBadge(cart);
            renderCartItems(cart);
            updateSummary(cart);
        }

        function updateSummary(cart) {
            const total = cart.reduce((acc, item) => acc + (item.price * item.quantity), 0);
            document.getElementById('summary-subtotal').innerText = total.toFixed(2) + ' €';
            document.getElementById('summary-total').innerText = total.toFixed(2) + ' €';
        }

        // --- UPDATED CHECKOUT FUNCTION ---
        function checkout() {
            const cart = JSON.parse(localStorage.getItem('cart') || '[]');
            if(cart.length === 0) {
                alert("Votre panier est vide.");
                return;
            }
            const token = localStorage.getItem('token');
            if(!token) {
                alert("Veuillez vous connecter pour passer commande.");
                window.location.href = 'login.html';
            } else {
                // Redirect to checkout page
                window.location.href = 'checkout.html';
            }
        }

        // --- 4. Utilities ---
        function updateCartBadge(cart) {
            // If cart isn't passed, fetch it
            if(!cart) cart = JSON.parse(localStorage.getItem('cart') || '[]');
            
            const badge = document.getElementById('cart-badge');
            const count = cart.reduce((acc, item) => acc + item.quantity, 0);
            
            if (count > 0) {
                badge.innerText = count;
                badge.classList.remove('opacity-0');
            } else {
                badge.classList.add('opacity-0');
            }
        }

        function checkAuth() {
            const token = localStorage.getItem('token');
            const user = JSON.parse(localStorage.getItem('user') || '{}');
            const authSection = document.getElementById('auth-section');

            if (token) {
                authSection.innerHTML = `
                    <div class="relative group">
                        <button class="w-10 h-10 bg-indigo-100 rounded-full flex items-center justify-center text-indigo-600 font-bold border border-indigo-200">
                            ${user.name ? user.name.charAt(0).toUpperCase() : 'U'}
                        </button>
                        <div class="absolute right-0 mt-2 w-48 bg-white rounded-xl shadow-xl border border-gray-100 hidden group-hover:block z-50">
                            <a href="#" onclick="localStorage.clear(); window.location.reload()" class="block px-4 py-2 text-sm text-red-600 hover:bg-red-50">Déconnexion</a>
                        </div>
                    </div>
                `;
            }
        }

        // Initialize
        loadCart();

    </script>
</body>
</html>
