<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Gestion Utilisateurs - Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="assets/js/config.js"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">

    <div class="flex min-h-screen">
        <aside class="w-64 bg-white border-r border-gray-200 flex-shrink-0 fixed h-full z-10">
            <div class="p-6">
                <div class="flex items-center gap-3 mb-8">
                    <div class="w-10 h-10 bg-gradient-to-br from-blue-600 to-indigo-600 rounded-lg flex items-center justify-center text-white shadow-md">
                        <i class="fas fa-shield-alt text-lg"></i>
                    </div>
                    <div>
                        <div class="text-gray-900 font-bold">Admin Panel</div>
                        <div class="text-xs text-gray-500 font-medium uppercase tracking-wide">Administrateur</div>
                    </div>
                </div>
                <nav class="space-y-2">
                    <a href="admin-dashboard.html" class="flex items-center gap-3 px-4 py-3 text-gray-700 hover:bg-gray-50 rounded-lg transition-colors font-medium">
                        <i class="fas fa-th-large w-5 text-center"></i> <span>Tableau de bord</span>
                    </a>
                    <a href="admin-users.html" class="flex items-center gap-3 px-4 py-3 bg-blue-50 text-blue-700 rounded-lg transition-colors font-medium">
                        <i class="fas fa-users w-5 text-center"></i> <span>Utilisateurs</span>
                    </a>
                    <a href="admin-stores.html" class="flex items-center gap-3 px-4 py-3 text-gray-700 hover:bg-gray-50 rounded-lg transition-colors font-medium">
                        <i class="fas fa-store w-5 text-center"></i> <span>Boutiques</span>
                    </a>
                    <a href="admin-products.html" class="flex items-center gap-3 px-4 py-3 text-gray-700 hover:bg-gray-50 rounded-lg transition-colors font-medium">
                        <i class="fas fa-box w-5 text-center"></i> <span>Produits</span>
                    </a>
                </nav>
            </div>
            <div class="absolute bottom-0 w-full p-6 border-t border-gray-100 bg-white">
                <a href="#" onclick="logout(event)" class="flex items-center gap-3 text-red-600 hover:bg-red-50 px-4 py-3 rounded-lg transition-colors font-medium">
                    <i class="fas fa-sign-out-alt w-5 text-center"></i> <span>Déconnexion</span>
                </a>
            </div>
        </aside>

        <main class="flex-1 ml-64 p-8">
            <div class="max-w-7xl mx-auto">
                <h1 class="text-3xl font-bold text-gray-900 mb-2">Gestion des utilisateurs</h1>
                <p class="text-gray-600 mb-8">Gérez tous les comptes enregistrés.</p>

                <div class="bg-white rounded-xl border border-gray-200 p-4 mb-6 shadow-sm">
                    <div class="flex items-center gap-4">
                        <input type="text" id="search-input" placeholder="Rechercher nom ou email..." class="flex-1 pl-4 pr-4 py-3 border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500">
                        <select id="role-filter" class="px-4 py-3 border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500">
                            <option value="all">Tous les rôles</option>
                            <option value="client">Client</option>
                            <option value="store_owner">Vendeur</option>
                            <option value="admin">Admin</option>
                        </select>
                    </div>
                </div>

                <div class="bg-white rounded-xl border border-gray-200 overflow-hidden shadow-sm">
                    <table class="w-full text-left">
                        <thead class="bg-gray-50 border-b border-gray-200">
                            <tr>
                                <th class="px-6 py-4 text-xs font-semibold text-gray-500 uppercase">Utilisateur</th>
                                <th class="px-6 py-4 text-xs font-semibold text-gray-500 uppercase">Email</th>
                                <th class="px-6 py-4 text-xs font-semibold text-gray-500 uppercase">Rôle</th>
                                <th class="px-6 py-4 text-xs font-semibold text-gray-500 uppercase">Inscrit le</th>
                                <th class="px-6 py-4 text-xs font-semibold text-gray-500 uppercase">Commandes</th>
                                <th class="px-6 py-4 text-xs font-semibold text-gray-500 uppercase">Actions</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-gray-200" id="users-table-body"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script>
        const API_URL = typeof API_BASE_URL !== 'undefined' ? API_BASE_URL : 'http://localhost:8000/api';
        const token = localStorage.getItem('token');
        let allUsers = [];

        if (!token) window.location.href = 'login.html';

        async function loadUsers() {
            try {
                const res = await fetch(`${API_URL}/admin/users`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if(res.ok) {
                    allUsers = await res.json();
                    renderUsers(allUsers);
                }
            } catch(e) { console.error(e); }
        }

        function renderUsers(users) {
            const tbody = document.getElementById('users-table-body');
            if(users.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="p-4 text-center">Aucun utilisateur.</td></tr>';
                return;
            }
            tbody.innerHTML = users.map(u => `
                <tr class="hover:bg-gray-50">
                    <td class="px-6 py-4 font-medium text-gray-900 flex items-center gap-3">
                        <div class="w-8 h-8 rounded-full bg-blue-100 flex items-center justify-center text-blue-600 font-bold">${u.name.charAt(0).toUpperCase()}</div>
                        ${u.name}
                    </td>
                    <td class="px-6 py-4 text-gray-600">${u.email}</td>
                    <td class="px-6 py-4">
                        <span class="px-2 py-1 rounded text-xs font-bold ${
                            u.role === 'store_owner' ? 'bg-purple-100 text-purple-700' :
                            u.role === 'admin' ? 'bg-red-100 text-red-700' : 'bg-green-100 text-green-700'
                        }">${u.role}</span>
                    </td>
                    <td class="px-6 py-4 text-gray-600">${new Date(u.created_at).toLocaleDateString('fr-FR')}</td>
                    <td class="px-6 py-4 font-bold">${u.orders_count || 0}</td>
                    <td class="px-6 py-4">
                        <button onclick="deleteUser(${u.id})" class="text-red-500 hover:text-red-700"><i class="fas fa-trash"></i></button>
                    </td>
                </tr>
            `).join('');
        }

        function filterUsers() {
            const term = document.getElementById('search-input').value.toLowerCase();
            const role = document.getElementById('role-filter').value;
            const filtered = allUsers.filter(u => {
                const matchesSearch = u.name.toLowerCase().includes(term) || u.email.toLowerCase().includes(term);
                const matchesRole = role === 'all' || u.role === role;
                return matchesSearch && matchesRole;
            });
            renderUsers(filtered);
        }

        async function deleteUser(id) {
            if(!confirm("Supprimer cet utilisateur ?")) return;
            await fetch(`${API_URL}/admin/users/${id}`, { method: 'DELETE', headers: { 'Authorization': `Bearer ${token}` } });
            loadUsers();
        }

        document.getElementById('search-input').addEventListener('input', filterUsers);
        document.getElementById('role-filter').addEventListener('change', filterUsers);

        function logout(e) { e.preventDefault(); localStorage.clear(); window.location.href='index.html'; }

        loadUsers();
    </script>
</body>
</html>
