version: '3.8'

services:
  # 1. The Backend Service (Laravel API)
  backend:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: cloudshop_backend
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./backend:/var/www
    # --- ADD THIS BLOCK ---
    ports:
      - "8000:8000"
    command: bash -c "composer install && php artisan serve --host=0.0.0.0 --port=8000"
    # ----------------------
    depends_on:
      - db
    networks:
      - cloudshop-network

  # 2. The Frontend Service (Static HTML/JS served by Nginx)
  frontend:
    image: nginx:alpine
    container_name: cloudshop_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
      # We map a custom config so Nginx knows how to handle the files
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - cloudshop-network

  # 3. The Database Service
  db:
    image: mysql:8.0
    container_name: cloudshop_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: cloudshop
      MYSQL_ROOT_PASSWORD: root
      MYSQL_PASSWORD: password
      MYSQL_USER: laravel
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - cloudshop-network

  # 4. Database Management Interface (Optional but helpful)
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: cloudshop_pma
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "8080:80"
    depends_on:
      - db
    networks:
      - cloudshop-network

# Networks and Volumes definition
networks:
  cloudshop-network:
    driver: bridge

volumes:
  dbdata: