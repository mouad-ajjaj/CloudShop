version: '3.8'

services:
  # 1. The Backend Service (Laravel API)
  backend:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: cloudshop_backend
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./backend:/var/www
    ports:
      - "8000:8000"
    command: bash -c "composer install && php artisan serve --host=0.0.0.0 --port=8000"
    depends_on:
      - db
    networks:
      - cloudshop-network

  # 2. The Frontend Service (Nginx)
  frontend:
    image: nginx:alpine
    container_name: cloudshop_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - cloudshop-network

  # 3. The Database Service (SECURED)
  db:
    image: mysql:8.0
    container_name: cloudshop_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: cloudshop
      MYSQL_ROOT_PASSWORD: uir2025        # UPDATED
      MYSQL_PASSWORD: uir2025             # UPDATED
      MYSQL_USER: laravel
    ports:
      - "127.0.0.1:3306:3306"             # UPDATED: Binds to localhost only
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - cloudshop-network

  # 4. Database Management (PhpMyAdmin)
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: cloudshop_pma
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: uir2025        # UPDATED
    ports:
      - "8080:80"
    depends_on:
      - db
    networks:
      - cloudshop-network

networks:
  cloudshop-network:
    driver: bridge

volumes:
  dbdata: